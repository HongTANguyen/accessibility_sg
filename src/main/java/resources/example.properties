## PROPERTIES FOR ACCESSIBILITY CALCULATIONS
# This is an example file. Copy this into your working directory and change the configuration and filepaths as appropriate.

# Boundary files (network should contain region)
region.boundary = boundaries/GM_boundary.gpkg
network.boundary = boundaries/NetworkBoundary.gpkg

# MATSim network (in .xml format)
matsim.network = network/network.xml

# End locations files
end.coords.0 = accessibility/Public_open_space_v3.0.csv
end.coords.1 = accessibility/Early_year_access.csv
end.coords.2 = accessibility/Food_retail.csv

end.description.0 = green
end.description.1 = edu
end.description.2 = food

# Power transforms for weights (WEIGHT ^ ALPHA)
end.alpha.0 = 0.25
end.alpha.1 = 0.5
end.alpha.2 = 0.5

# Input & output files
input = manchester/grid100.gpkg
output = manchester/grid100_results.gpkg

# Node analysis - optional output file (.gpkg)
output.nodes = accessibility/food_results.gpkg

# Calculation direction. true = forward (active). false = reverse (passive). Comment out for 2-way (roundtrip) estimation
forward = true

# Define mode (walk, bike, or car)
mode = walk

# Define disutility type (short, fast, jibe)
disutility = short

## DECAY FUNCTION
# Define decay function (cumulative, exponential, gaussian, power, or cumulative gaussian)
decay.function = cumulative gaussian

# Decay function parameters (depends on function type)
beta = 0.354
a = 200
v = 129842

## CUTOFF VALUES
# These are cutoff values beyond which destinations are not included in the accessibility calculation.
# At least one must be defined if using cumulative decay.
# Cutoff distance in meters
cutoff.distance = 1600

# Cutoff time in seconds
cutoff.time = 600

# Other properties
coordinate.system = EPSG:27700
number.of.threads = 14
max.bike.speed = 5.5